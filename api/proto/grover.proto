syntax = "proto3";

// Grover control plane.
//
// Layering:
//   RelayControl    - dumb byte/datagram forwards on relay nodes.
//   RouteControl    - named network paths (source, relays, destination). No file data.
//   SessionControl  - materialized routes, stored on the route's source node.
//   TransferControl - data endpoints and transfer jobs.
//   HistoryControl  - read-only access to on-disk job logs.
//
// Conventions: zero values mean "unset" in requests. Every node runs every service.
package grover.v1;

option go_package = "github.com/jgoldverg/grover/internal/pb;pb";

message Empty {}

enum DataProtocol {
  DATA_PROTOCOL_UNSPECIFIED = 0;
  DATA_PROTOCOL_TCP = 1;
  DATA_PROTOCOL_UDP = 2;
}

// ConnectionOrigin says which side dials the data connection. Bytes always flow
// source -> destination. DESTINATION is for nodes that can only dial outbound.
enum ConnectionOrigin {
  CONNECTION_ORIGIN_UNSPECIFIED = 0;
  CONNECTION_ORIGIN_SOURCE = 1;
  CONNECTION_ORIGIN_DESTINATION = 2;
}

enum RuntimeState {
  RUNTIME_STATE_UNSPECIFIED = 0;
  RUNTIME_STATE_READY = 1;
  RUNTIME_STATE_RUNNING = 2;
  RUNTIME_STATE_DONE = 3;
  RUNTIME_STATE_ABORTED = 4;
  RUNTIME_STATE_FAILED = 5;
}

message DataEndpoint {
  string host = 1;
  uint32 port = 2;
}

// Tuning is the single representation of transfer tuning. Zero means "inherit".
message Tuning {
  uint32 concurrency = 1;           // files in flight
  uint32 parallelism = 2;           // streams per file
  uint64 chunk_size_bytes = 3;      // read/write buffer size
  uint32 udp_mtu = 4;               // UDP datagram size
  uint32 udp_window_packets = 5;    // max in-flight packets per UDP stream
  uint32 udp_batch_packets = 6;     // packets per sendmmsg/recvmmsg
  uint32 udp_ack_every_packets = 7;
  uint32 udp_ack_every_ms = 8;
  uint64 udp_socket_read_bytes = 9;
  uint64 udp_socket_write_bytes = 10;
  uint64 udp_write_flush_bytes = 11; // receive-side write coalescing
  string udp_flow_control = 12;      // fixed | bbr
}

message Stats {
  uint64 bytes_in = 1;
  uint64 bytes_out = 2;
  uint64 packets = 3;
  uint64 errors = 4;
  uint32 active_connections = 5;
  double average_bps = 6;
}

// ---------------------------------------------------------------- relays

message Forward {
  string forward_id = 1;
  string route_id = 2;
  string session_id = 3;
  uint32 hop_index = 4;
  DataProtocol protocol = 5;
  DataEndpoint ingress = 6;
  DataEndpoint egress = 7;
  RuntimeState state = 8;
  Stats stats = 9;
  string error = 10;
  int64 created_at_unix_nano = 11;
}

message CreateForwardRequest {
  string route_id = 1;
  string session_id = 2;
  uint32 hop_index = 3;
  DataProtocol protocol = 4;
  DataEndpoint egress = 5;
}

message ForwardRef { string forward_id = 1; }
message ListForwardsRequest { string route_id = 1; string session_id = 2; }
message ForwardList { repeated Forward forwards = 1; }

service RelayControl {
  rpc CreateForward(CreateForwardRequest) returns (Forward);
  rpc GetForward(ForwardRef) returns (Forward);
  rpc ListForwards(ListForwardsRequest) returns (ForwardList);
  rpc DeleteForward(ForwardRef) returns (Empty);
}

// ---------------------------------------------------------------- routes

// Route is a named network path. source/destination/via are groverd control
// addresses (host:port). Routes never carry file paths.
message Route {
  string name = 1;
  string source = 2;
  string destination = 3;
  repeated string via = 4; // ordered from source toward destination
  DataProtocol protocol = 5;
  ConnectionOrigin connect_from = 6;
  int64 created_at_unix_nano = 7;
  int64 updated_at_unix_nano = 8;
}

message RouteRef { string name = 1; }
message RouteList { repeated Route routes = 1; }

service RouteControl {
  rpc PutRoute(Route) returns (Route);
  rpc GetRoute(RouteRef) returns (Route);
  rpc ListRoutes(Empty) returns (RouteList);
  rpc DeleteRoute(RouteRef) returns (Empty);
}

// ---------------------------------------------------------------- sessions

enum EndpointRole {
  ENDPOINT_ROLE_UNSPECIFIED = 0;
  ENDPOINT_ROLE_SOURCE = 1;
  ENDPOINT_ROLE_DESTINATION = 2;
}

// TransferEndpoint is a prepared data-plane resource on one node.
//   DESTINATION + origin SOURCE:      listener at `data`; senders dial it.
//   SOURCE + origin DESTINATION:      listener at `data`; the destination dials it.
//   DESTINATION + origin DESTINATION: dials `data` and keeps a connection pool open.
// Every data connection/stream must present `token`.
message TransferEndpoint {
  string endpoint_id = 1;
  string session_id = 2;
  string route_id = 3;
  EndpointRole role = 4;
  DataProtocol protocol = 5;
  ConnectionOrigin connect_from = 6;
  DataEndpoint data = 7;
  bytes token = 8;
  int64 created_at_unix_nano = 9;
}

message Hop {
  uint32 index = 1;          // 1-based, ordered source -> destination
  string control = 2;        // relay groverd control address
  string forward_id = 3;
  DataEndpoint ingress = 4;
  DataEndpoint egress = 5;
}

// RouteSession is a materialized route. It lives on the route's source node,
// which uses it to run jobs. `state` and `active_job_id` are computed by the
// source node: RUNNING while a job is using the session, READY otherwise.
message RouteSession {
  string session_id = 1;
  string route_id = 2;
  DataProtocol protocol = 3;
  ConnectionOrigin connect_from = 4;
  string source_control = 5;
  string destination_control = 6;
  TransferEndpoint source = 7;      // set when connect_from = DESTINATION
  TransferEndpoint destination = 8;
  repeated Hop hops = 9;
  DataEndpoint data = 10;           // where the source sends (origin SOURCE)
  RuntimeState state = 11;
  string active_job_id = 12;
  int64 created_at_unix_nano = 13;
}

message SessionRef { string session_id = 1; }
message ListSessionsRequest { string route_id = 1; }
message SessionList { repeated RouteSession sessions = 1; }

service SessionControl {
  rpc CreateSession(RouteSession) returns (RouteSession);
  rpc GetSession(SessionRef) returns (RouteSession);
  rpc ListSessions(ListSessionsRequest) returns (SessionList);
  rpc DeleteSession(SessionRef) returns (Empty);
}

// ---------------------------------------------------------------- transfers

message PrepareEndpointRequest {
  string session_id = 1;
  string route_id = 2;
  EndpointRole role = 3;
  DataProtocol protocol = 4;
  ConnectionOrigin connect_from = 5;
  // DESTINATION + origin DESTINATION only: where to dial, the token the
  // source listener expects, and how many connections to keep open.
  DataEndpoint dial = 6;
  bytes token = 7;
  uint32 connections = 8;
}

message EndpointRef { string endpoint_id = 1; }

message StreamState {
  uint32 stream_id = 1;
  uint64 offset = 2;
  uint64 size = 3;
  uint64 bytes_done = 4;
  RuntimeState state = 5;
  double current_bps = 6;
  string error = 7;
}

message FileState {
  string source_path = 1;
  string relative_path = 2;
  uint64 size = 3;
  uint64 bytes_done = 4;
  RuntimeState state = 5;
  string error = 6;
  repeated StreamState streams = 7;
}

enum FileView {
  FILE_VIEW_NONE = 0;
  FILE_VIEW_ACTIVE = 1; // running and failed files only
  FILE_VIEW_ALL = 2;
}

// Job is a transfer job as seen by one node. role SOURCE is the sending job;
// role DESTINATION is the receive-side view of the same job id.
message Job {
  string job_id = 1;
  string route_id = 2;
  string session_id = 3;
  EndpointRole role = 4;
  RuntimeState state = 5;
  DataProtocol protocol = 6;
  string destination = 7;
  DataEndpoint destination_data = 8;
  Tuning tuning = 9;
  uint32 files_total = 10;
  uint32 files_done = 11;
  uint32 files_failed = 12;
  uint32 files_active = 13;
  uint32 streams_active = 14;
  uint64 bytes_total = 15;
  uint64 bytes_done = 16;
  uint64 network_bytes = 17;
  uint64 disk_read_bytes = 18;
  uint64 disk_write_bytes = 19;
  uint64 retransmits = 20;
  double current_bps = 21;
  double average_bps = 22;
  double rtt_ms = 23;
  int64 started_at_unix_nano = 24;
  int64 finished_at_unix_nano = 25;
  int64 sampled_at_unix_nano = 26;
  string error = 27;
  repeated FileState files = 28;
}

message StartJobRequest {
  string job_id = 1;          // optional; generated when empty
  string session_id = 2;      // empty: copy locally on this node
  repeated string sources = 3; // absolute paths on this node, or synthetic://<bytes>/<rel/path>
  string destination = 4;     // absolute directory on the destination node
  Tuning tuning = 5;
}

message GetJobRequest { string job_id = 1; FileView files = 2; }
message ListJobsRequest { string route_id = 1; }
message JobList { repeated Job jobs = 1; }
message JobRef { string job_id = 1; }
message TuneJobRequest { string job_id = 1; Tuning tuning = 2; }
message WatchJobRequest { string job_id = 1; uint32 interval_ms = 2; FileView files = 3; }
message DeletePathRequest { string path = 1; }

service TransferControl {
  rpc PrepareEndpoint(PrepareEndpointRequest) returns (TransferEndpoint);
  rpc CloseEndpoint(EndpointRef) returns (Empty);
  rpc StartJob(StartJobRequest) returns (Job);
  rpc GetJob(GetJobRequest) returns (Job);
  rpc ListJobs(ListJobsRequest) returns (JobList);
  rpc AbortJob(JobRef) returns (Job);
  rpc TuneJob(TuneJobRequest) returns (Job);
  rpc WatchJob(WatchJobRequest) returns (stream Job);
  // DeletePath removes one regular file. Used to clean up synthetic schedule output.
  rpc DeletePath(DeletePathRequest) returns (Empty);
}

// ---------------------------------------------------------------- history

message ManifestFile {
  string source_path = 1;
  string relative_path = 2;
  uint64 size = 3;
}

// Manifest is written to <job_log_dir>/<job>/manifest.json when a job starts.
message Manifest {
  string job_id = 1;
  string route_id = 2;
  string session_id = 3;
  EndpointRole role = 4;
  DataProtocol protocol = 5;
  string destination = 6;
  Tuning tuning = 7;
  uint32 files_total = 8;
  uint64 bytes_total = 9;
  int64 created_at_unix_nano = 10;
  repeated ManifestFile files = 11;
}

message HistoryEntry {
  string job_id = 1;
  string route_id = 2;
  EndpointRole role = 3;
  RuntimeState state = 4;
  string error = 5;
  uint64 bytes_total = 6;
  uint64 bytes_done = 7;
  int64 started_at_unix_nano = 8;
  double duration_seconds = 9;
  double throughput_bps = 10;
  double energy_joules = 11;
  string dir = 12;
}

message ListHistoryRequest {
  string route_id = 1;
  int64 since_unix_nano = 2;
  int64 until_unix_nano = 3;
  uint32 limit = 4;
}
message HistoryList { repeated HistoryEntry jobs = 1; }

message HistoryRef { string job_id = 1; EndpointRole role = 2; }
message HistoryRecord {
  HistoryEntry entry = 1;
  Manifest manifest = 2;
  Job final = 3;
}

message ListSnapshotsRequest { string job_id = 1; EndpointRole role = 2; uint32 limit = 3; }
message EnergyRequest { string job_id = 1; EndpointRole role = 2; uint32 limit = 3; }
message EnergyCSV { string header = 1; repeated string rows = 2; }

service HistoryControl {
  rpc ListHistory(ListHistoryRequest) returns (HistoryList);
  rpc GetHistory(HistoryRef) returns (HistoryRecord);
  rpc ListSnapshots(ListSnapshotsRequest) returns (JobList);
  rpc GetEnergy(EnergyRequest) returns (EnergyCSV);
}
